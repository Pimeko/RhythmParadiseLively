<!DOCTYPE html>
<html>

<head>
    <title>Rhythm Paradise</title>
    <style>
	
        html {
            background-image: url("img/background.png");
            background-size: cover;
			overflow: hidden;
        }

		body {
			margin: 0;
			-webkit-user-select: none;
			user-select: none;
		}

		img {
			-webkit-user-drag: none;
		}

		#ceyes, #ceyes img {
			position: absolute;
		}
		
		#container {
			display: grid;
			place-items: center;
			height: 100vh;
			overflow: hidden;
			position: relative;
		}
				
		#wrapper {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
		}

		#guy {
			display: block;
			image-rendering: pixelated;
		}

		#guy.pop {
			animation: guy-pop 0.2s ease-out;
		}

		@keyframes guy-pop {
			0%   { transform: scale(1); }
			40%  { transform: scale(1.08); }
			100% { transform: scale(1); }
		}

		.eye {
			pointer-events:none;
		}
				
		table, th, td {
		  border: 0px solid black;
		  border-collapse: collapse;
		}
		
		.top-bottom-safeZone {
			height: 280px;
		}
		
		.left-right-safeZone {
			width: 380px;
		}
		
    </style>
</head>

<body>
	<div id="container">
		
		<table id="wrapper">
			<tr>
				<td colspan="3" class="top-bottom-safeZone">&nbsp;</td>
			</tr>
			<tr>
				<td class="left-right-safeZone">&nbsp;</td>
				<td><img src="img/chorus/cell_06.png" id="guy" style="z-index: 1000;"  /></td>
				<td class="left-right-safeZone">&nbsp;</td>
			</tr>
			<tr>
				<td colspan="3" class="top-bottom-safeZone">&nbsp;</td>
			</tr>
		</table>
		
		<div id="ceyes">
			<img src="img/eye.png" class="eye" style="top:-230px; left:10px; opacity:0;"/>
			<img src="img/eye.png" class="eye" style="top:-230px; right:10px; opacity:0;" />
		</div>
	</div>

    <script type="text/javascript">
        var GUY_SCALE = 6              // agrandissement des sprites DS (56x92 px) ; entier = pixels nets
        var SCREAM_TRANSITION_SPEED = 5  // vitesse du passage demi-cri <-> cri (1 = vitesse du jeu)
        var IDLE_REPEAT = 10            // nombre de fois que la séquence 6 est jouée avant la séquence 1
        var SCREAM_LOOP_FRAMES = 3     // nombre de frames de fin du passage au cri qui bouclent pendant le cri
        var TICK_MS = 1000 / 60        // durée d'un tick DS (les durées des séquences sont en ticks)

        // Séquences du chorus.NANR : [cellule, durée en ticks]
        var SEQ = {
            1:  [[6, 4], [7, 4], [6, 4], [7, 4], [6, 4], [7, 4], [8, 4], [9, 4], [10, 4], [19, 4]],
            6:  [[6, 5], [7, 5], [6, 5], [7, 5]],
            11: [[25, 2], [24, 2], [23, 2]],
            12: [[20, 6], [21, 6], [22, 4]],
            13: [[11, 6], [12, 6], [13, 6], [14, 4], [15, 4], [16, 4], [20, 6], [21, 6], [22, 4]]
        };

        // Lecteur : une piste idle <-> demi-cri <-> cri, parcourue dans un sens ou dans l'autre
        var guyAnim = (function () {
            var img = document.getElementById("guy")
            img.width = 56 * GUY_SCALE
            img.height = 92 * GUY_SCALE

            var idleLoop = []
            for (var i = 0; i < IDLE_REPEAT; i++) idleLoop = idleLoop.concat(SEQ[6])
            idleLoop = idleLoop.concat(SEQ[1])

            // Les transitions sont lues vers l'avant pour monter (idle -> cri), à l'envers pour redescendre
            var toScream = SEQ[13].slice().reverse()
            var track = [
                { loop: true,  frames: idleLoop },                                 // 0 idle
                { loop: false, frames: SEQ[11], speed: 1 },                        // 1 idle <-> demi-cri
                { loop: true,  frames: SEQ[12] },                                  // 2 demi-cri
                { loop: false, frames: toScream, speed: SCREAM_TRANSITION_SPEED },  // 3 demi-cri <-> cri
                { loop: true,  frames: toScream.slice(-SCREAM_LOOP_FRAMES).reverse() } // 4 cri
            ]
            var LEVEL = { idle: 0, half: 2, scream: 4 }

            // Précharge toutes les cellules pour éviter un clignotement au premier affichage
            track.forEach(function (seg) {
                seg.frames.forEach(function (f) { new Image().src = cellSrc(f[0]) })
            })

            var target = 0
            var level = 0
            var index = 0
            var shownCell = -1

            function cellSrc(cell) {
                return "img/chorus/cell_" + (cell < 10 ? "0" : "") + cell + ".png"
            }

            // Entre dans un segment par son début (en montant) ou sa fin (en descendant)
            function enter(newLevel, dir) {
                level = newLevel
                var frames = track[level].frames
                index = dir > 0 || track[level].loop ? 0 : frames.length - 1
                // Évite d'afficher deux fois de suite la même cellule à la jonction
                if (frames.length > 1 && frames[index][0] === shownCell) index += dir > 0 || track[level].loop ? 1 : -1
            }

            function step() {
                var seg = track[level]
                if (seg.loop && level === target) {
                    index = (index + 1) % seg.frames.length
                } else {
                    var dir = target > level ? 1 : -1
                    if (seg.loop) {
                        enter(level + dir, dir)
                    } else {
                        index += dir
                        if (index < 0 || index >= seg.frames.length) enter(level + dir, dir)
                    }
                }
            }

            function tick() {
                var seg = track[level]
                var frame = seg.frames[index]
                if (frame[0] !== shownCell) {
                    img.src = cellSrc(frame[0])
                    shownCell = frame[0]
                }
                setTimeout(function () {
                    step()
                    tick()
                }, Math.max(1, frame[1]) * TICK_MS / (seg.speed || 1))
            }
            tick()

            return {
                setTarget: function (state) { target = LEVEL[state] }
            }
        })();
    </script>

    <script type="text/javascript">
		var SCREAM_RADIUS = 280;       // rayon (px) autour du centre du guy dans lequel il crie

		const guy = document.getElementById('guy');
		const wrapper = document.getElementById('wrapper');
		const eyes_new = document.querySelectorAll('.eye');

		function scream(){
			guyAnim.setTarget("scream");
			hideEyes();
		}
		
		function halfScream(){
			guyAnim.setTarget("half");
			hideEyes();                // les frames DS ont déjà leurs yeux
		}
		
		function idle(){
			guyAnim.setTarget("idle");
			hideEyes();
		}
		
		function showEyes(){
			eyes_new.forEach(e => { e.style.opacity = 100; });	
		}
		
		function hideEyes(){
			eyes_new.forEach(e => { e.style.opacity = 0; });	
		}

		// Cri dans le cercle, demi-cri ailleurs dans le tableau, repos en dehors
		var currentState = "idle";
		function setState(state){
			if (state === currentState) return;
			currentState = state;
			if (state === "scream") scream();
			else if (state === "half") halfScream();
			else idle();
		}

		function updateState(x, y, target){
			const r = guy.parentElement.getBoundingClientRect();
			const dx = x - (r.left + r.width / 2);
			const dy = y - (r.top + r.height / 2);
			if (dx * dx + dy * dy <= SCREAM_RADIUS * SCREAM_RADIUS) setState("scream");
			else if (wrapper.contains(target)) setState("half");
			else setState("idle");
		}

		document.addEventListener("mousemove", e => updateState(e.clientX, e.clientY, e.target));
		document.documentElement.addEventListener("mouseleave", () => setState("idle"));
	
        (function () {
		
			const rekt = guy.getBoundingClientRect();
			const anchorX = rekt.left + rekt.width / 2;
			const anchorY = rekt.top + rekt.height / 2 - 250;
			
            document.onmousemove = handleMouseMove;

            function handleMouseMove(e) {
                var x = e.clientX;
                var y = e.clientY;

                var isIdle = false;
                var isHalf = false;
				
				const angleDeg = angle(x, y, anchorX, anchorY);
				
				eyes_new.forEach(e => {
					e.style.transform = `rotate(${90+angleDeg}deg)`;
				});
            }

			function angle(cx, cy, ex, ey){
				const dy = ey - cy;
				const dx = ex - cx;
				const rad = Math.atan2(dy, dx);
				const deg = rad * 180 / Math.PI;
				return deg;
			}

        })();
    </script>

    <script type="text/javascript">
        var CIRCLE_RADIUS = 350        // rayon du cercle en px
        var CIRCLE_COLOR = "red"       // couleur du trait
        var CIRCLE_THICKNESS = 4       // épaisseur du trait en px
        var CLICKS_TO_TOGGLE = 5       // nombre de clics nécessaires
        var CROSS_COUNT = 6            // nombre de croix sur le cercle (la 1re à midi)
        var CROSS_SIZE = 40            // taille d'une croix en px
        var CROSS_THICKNESS = 6        // épaisseur des branches d'une croix en px
        var CROSS_COLOR = "red";       // couleur des croix (le ";" est obligatoire avant l'IIFE)

        (function () {
            var guyImg = document.getElementById("guy")
            var clickCount = 0

            var circle = document.createElement("div")
            circle.style.position = "fixed"
            circle.style.width = (CIRCLE_RADIUS * 2) + "px"
            circle.style.height = (CIRCLE_RADIUS * 2) + "px"
            circle.style.border = CIRCLE_THICKNESS + "px solid " + CIRCLE_COLOR
            circle.style.borderRadius = "50%"
            circle.style.boxSizing = "border-box"
            circle.style.pointerEvents = "none"
            circle.style.zIndex = "2000"
            circle.style.display = "none"
            document.body.appendChild(circle)

            // Les enfants sont positionnés par rapport à l'intérieur de la bordure
            var center = CIRCLE_RADIUS - CIRCLE_THICKNESS
            var trackRadius = CIRCLE_RADIUS - CIRCLE_THICKNESS / 2
            for (var i = 0; i < CROSS_COUNT; i++) {
                var angle = (2 * Math.PI * i) / CROSS_COUNT
                var cross = document.createElement("div")
                cross.style.position = "absolute"
                cross.style.width = CROSS_SIZE + "px"
                cross.style.height = CROSS_SIZE + "px"
                cross.style.left = (center + trackRadius * Math.sin(angle) - CROSS_SIZE / 2) + "px"
                cross.style.top = (center - trackRadius * Math.cos(angle) - CROSS_SIZE / 2) + "px"
                cross.style.pointerEvents = "none"
                for (var j = 0; j < 2; j++) {
                    var bar = document.createElement("div")
                    bar.style.position = "absolute"
                    bar.style.left = "0"
                    bar.style.top = ((CROSS_SIZE - CROSS_THICKNESS) / 2) + "px"
                    bar.style.width = CROSS_SIZE + "px"
                    bar.style.height = CROSS_THICKNESS + "px"
                    bar.style.background = CROSS_COLOR
                    bar.style.transform = "rotate(" + (j === 0 ? 45 : -45) + "deg)"
                    bar.style.pointerEvents = "none"
                    cross.appendChild(bar)
                }
                circle.appendChild(cross)
            }

            // Centre le cercle sur le centre réel de l'image affichée
            function placeCircle() {
                var r = guyImg.parentElement.getBoundingClientRect()
                circle.style.left = (r.left + r.width / 2 - CIRCLE_RADIUS) + "px"
                circle.style.top = (r.top + r.height / 2 - CIRCLE_RADIUS) + "px"
            }

            window.addEventListener("resize", placeCircle)

            document.addEventListener("click", function (e) {
                if (currentState !== "scream") {
                    clickCount = 0
                    return
                }
                clickCount++
                if (clickCount >= CLICKS_TO_TOGGLE) {
                    clickCount = 0
                    placeCircle()
                    circle.style.display = circle.style.display === "none" ? "block" : "none"
                }
            })
        })();
    </script>

    <script type="text/javascript">
        (function () {
            var guyImg = document.getElementById("guy")

            // Relance l'animation à chaque clic, même pendant qu'elle tourne
            guyImg.addEventListener("click", function () {
                guyImg.classList.remove("pop")
                void guyImg.offsetWidth
                guyImg.classList.add("pop")
            })
            guyImg.addEventListener("animationend", function () {
                guyImg.classList.remove("pop")
            })
        })();
    </script>

    <script type="text/javascript">
        var PARALLAX_MAX_SHIFT = 12    // déplacement max du guy en px (vers la souris)
        var PARALLAX_MAX_TILT = 6      // inclinaison max du guy en degrés
        var PARALLAX_SMOOTHING = 0.2   // vitesse de suivi (0..1, plus haut = plus réactif)
        var VIBRATE_AMPLITUDE = 1.5      // amplitude de la vibration en px
        var VIBRATE_TILT = 1.5           // amplitude de la vibration en rotation (degrés)
        var VIBRATE_INTERVAL = 35;     // ms entre deux secousses

        // Quand la souris est dans le cercle de cri, le guy se décale, penche selon sa position et vibre
        (function () {
            var guyImg = document.getElementById("guy")
            var target = { x: 0, y: 0, tilt: 0 }
            var current = { x: 0, y: 0, tilt: 0 }
            var shake = { x: 0, y: 0, tilt: 0 }
            var hovering = false
            var lastShake = 0

            function reset() {
                hovering = false
                target.x = target.y = target.tilt = 0
            }

            document.addEventListener("mousemove", function (e) {
                var r = guyImg.parentElement.getBoundingClientRect()
                var nx = (e.clientX - (r.left + r.width / 2)) / SCREAM_RADIUS
                var ny = (e.clientY - (r.top + r.height / 2)) / SCREAM_RADIUS
                if (nx * nx + ny * ny > 1) {
                    reset()
                    return
                }
                hovering = true
                target.x = nx * PARALLAX_MAX_SHIFT
                target.y = ny * PARALLAX_MAX_SHIFT
                target.tilt = nx * PARALLAX_MAX_TILT
            })
            document.documentElement.addEventListener("mouseleave", reset)

            function rand(a) { return (Math.random() * 2 - 1) * a }

            function frame(now) {
                current.x += (target.x - current.x) * PARALLAX_SMOOTHING
                current.y += (target.y - current.y) * PARALLAX_SMOOTHING
                current.tilt += (target.tilt - current.tilt) * PARALLAX_SMOOTHING

                if (!hovering) {
                    shake.x = shake.y = shake.tilt = 0
                } else if (now - lastShake >= VIBRATE_INTERVAL) {
                    lastShake = now
                    shake.x = rand(VIBRATE_AMPLITUDE)
                    shake.y = rand(VIBRATE_AMPLITUDE)
                    shake.tilt = rand(VIBRATE_TILT)
                }

                guyImg.style.translate = (current.x + shake.x) + "px " + (current.y + shake.y) + "px"
                guyImg.style.rotate = (current.tilt + shake.tilt) + "deg"
                requestAnimationFrame(frame)
            }
            requestAnimationFrame(frame)
        })();
    </script>
</body>

</html>
